<h1>Application Index</h1>
<p>This is the index of the new JPI app.</p>

<form onsubmit="
	TestProtected();
	return false;
">
	<button class="success" type="submit">Get accounts (Protected)</button>
	<p class="row" id="result">Results here...</p>
</form>

<form onsubmit="
	RemoveToken();
	return false;
">
	<button class="success" type="submit">Remove token</button>
	<p class="row" id="token_result">Token removal results here...</p>
</form>

<script>
async function TestProtected() {
	const token = localStorage.getItem("token");
	console.log("Testing JWT token: ", token);
	try {
		const results = await fetch("/api?table=accounts", {
			method: "GET",
			headers: {
				"Authorization": `${token}`
			}
		});
		if (results.status === 401) {
			console.error("Not authenticated");
			localStorage.clear();
			location.href = "/login";
			return ;
		}
		const result_json = await results.json();
		document.getElementById("result").innerHTML = "";
		result_json.map(item => {
			const col4 = document.createElement("div");
			col4.className = "col4";
			const card = document.createElement("div");
			card.className = "card";
			const node = document.createElement("p");
			const textnode = document.createTextNode(item.email);
			node.appendChild(textnode);
			card.appendChild(node);
			col4.appendChild(card);
			document.getElementById("result").appendChild(col4);
		})
	} catch (error) {
		console.error(error);
	}
}

async function RemoveToken() {
	try {
		localStorage.removeItem("token");
		document.getElementById("token_result").innerText = "Token removed";
	} catch (error) {
		document.getElementById("token_result").innerText = `Could not erase the token. Error: ${error.message}`;
	}
}
</script>
